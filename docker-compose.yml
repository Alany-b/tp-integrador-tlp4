services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: tlp4
      POSTGRES_PASSWORD: tlp4
      POSTGRES_DB: tp_integrador
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: frontend
    ports:
      - "5173:5173"

volumes:
  pgdata:
