services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: tlp4
      POSTGRES_PASSWORD: tlp4
      POSTGRES_DB: tp_integrador
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: backend
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tlp4
      DB_PASSWORD: tlp4
      DB_NAME: tp_integrador
      JWT_SECRET: cambiar_este_secreto_local
      API_PORT: 3000
    ports:
      - "3000:3000"
    restart: on-failure

volumes:
  pgdata:
